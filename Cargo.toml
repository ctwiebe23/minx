[package]
name = "minx"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = "4.15.0"
actix-ws = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
maud = { version = "0.27.0", features = ["actix-web"] }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
